<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            line-height: 1.6;
            color: #333;
        }
    </style>
</head>
<body>

    <h1>Application Form</h1>
    <p>enter this and i might let u join.</p>
    
    <!-- The form tag now wraps all inputs and points to Formspree -->
    <form action="https://formspree.io/f/mljbglvo" method="POST">
        
        <label for="name">full name:</label><br>
        <input type="text" id="name" name="name" style="width: 100%; padding: 8px; margin: 8px 0;" required><br><br>

        <label for="year">Your year:</label><br>
        <input type="text" id="year" name="year" style="width: 100%; padding: 8px; margin: 8px 0;"><br><br>

        <label for="house">house:</label><br>
        <input type="text" id="house" name="house" style="width: 100%; padding: 8px; margin: 8px 0;"><br><br>

        <label for="reason">How did you hear abt this?</label><br>
        <textarea id="reason" name="reason" rows="4" style="width: 100%; padding: 8px; margin: 8px 0;"></textarea><br><br>
                
        <label for="snap">whats ur snap:</label><br>
        <input type="text" id="snap" name="snap" style="width: 100%; padding: 8px; margin: 8px 0;"><br><br>

        <label for="grass">are you a grass:</label><br>
        <input type="text" id="grass" name="grass" style="width: 100%; padding: 8px; margin: 8px 0;"><br><br>

        <button type="submit" style="padding: 10px 20px;">Submit Application</button>
    </form>

</body>
</html>
